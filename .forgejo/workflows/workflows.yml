name: Compile and lint code
on:
  pull_request:
    types: [synchronize, opened]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-code:
    # Our own PRs run on the Mac runners; outsiders' PRs (AGit via the github bot) stay on Linux
    runs-on: ${{ contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login) && 'macos-latest' || 'ubuntu-latest' }}
    # yarn 3 caches packages per checkout by default; the global cache persists between runs on the Mac runners
    env:
      YARN_ENABLE_GLOBAL_CACHE: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Linux caches node_modules (a hit skips the install); on the Mac a warm yarn cache installs faster than actions/cache restores
      - id: modules
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: modules-${{ runner.os }}-22-${{ hashFiles('yarn.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
      # Independent checks run in parallel; any failure fails the step
      - run: |
          yarn tsc --skipLibCheck &
          yarn lint &
          for job in $(jobs -p); do wait $job || exit 1; done
