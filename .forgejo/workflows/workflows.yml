name: Compile and lint code
on:
  pull_request:
    types: [synchronize, opened]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # node_modules itself is cached: a hit skips the install entirely
      - id: modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: modules-${{ runner.os }}-22-${{ hashFiles('yarn.lock') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: yarn install --immutable
      # Independent checks run in parallel; any failure fails the step
      - run: |
          yarn -s tsc --skipLibCheck &
          yarn -s lint &
          for job in $(jobs -p); do wait $job || exit 1; done
